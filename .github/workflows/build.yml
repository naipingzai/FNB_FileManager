name: Build

on:
  push:
    branches: [main, master, develop]
    tags: ['v*', 'release-*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ ninja-build pkg-config make \
            libgtk-3-dev libasound2-dev libmpv-dev libx11-dev \
            libbz2-dev liblzma-dev zlib1g-dev

      - name: Build x264 static lib
        run: |
          cd /tmp
          git clone --depth 1 --branch stable https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure --enable-static --disable-shared --enable-pic --disable-cli
          make -j$(nproc)
          sudo cp libx264.a /usr/lib/x86_64-linux-gnu/

      - name: Flutter pub get
        run: flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Verify
        run: test -f build/linux/x64/release/bundle/fn_file_manager

      - name: Package
        run: |
          cd build/linux/x64/release
          tar -czf fn_file_manager-linux-x86_64.tar.gz bundle

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fn-file-manager-linux-x86_64
          path: build/linux/x64/release/fn_file_manager-linux-x86_64.tar.gz
          retention-days: 14

  android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build
        run: flutter build apk --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fn-file-manager-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  summarize:
    name: Summary
    runs-on: ubuntu-22.04
    needs: [linux, android]
    if: always()
    steps:
      - run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | ${{ needs.linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.android.result }} |" >> $GITHUB_STEP_SUMMARY

  release:
    name: Release
    runs-on: ubuntu-22.04
    needs: [linux, android]
    if: startsWith(github.ref, 'refs/tags/') && success()
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          FILES=$(find release-assets -type f | sort)
          if [ -n "${FILES}" ]; then
            gh release create "${TAG}" \
              --title "FN File Manager ${TAG}" \
              --notes "Cross-platform builds: Linux / Android" \
              ${FILES}
          fi
